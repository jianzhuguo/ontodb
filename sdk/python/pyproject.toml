[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ontodb"
version = "0.6.1"
description = "Python SDK for OntoDB — the ontology-driven semantic multi-modal database"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "OntoDB Team", email = "sdk@ontodb.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ontodb", "database", "semantic", "ontology", "vector", "graph"]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]
sqlalchemy = [
    "sqlalchemy>=1.4.0",
]

[project.urls]
Homepage = "https://ontodb.io"
Documentation = "https://docs.ontodb.io"
Repository = "https://gitee.com/ontovalue/ontodb-python"
Issues = "https://gitee.com/ontovalue/ontodb-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ontodb*"]
