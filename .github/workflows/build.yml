name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ontodb-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ontodb-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ontodb-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ontodb-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ontodb-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p onto-server -p onto-cli -p ontodb-rules

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ontodb-server dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/ontodb dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/ontodb-rules dist/ 2>/dev/null || true
          cp LICENSE NOTICE README.md dist/
          cp -r rules dist/ 2>/dev/null || true
          tar czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          Copy-Item "target\${{ matrix.target }}\release\ontodb-server.exe" dist\ -ErrorAction SilentlyContinue
          Copy-Item "target\${{ matrix.target }}\release\ontodb.exe" dist\ -ErrorAction SilentlyContinue
          Copy-Item "target\${{ matrix.target }}\release\ontodb-rules.exe" dist\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE, NOTICE, README.md dist\
          Copy-Item rules dist\ -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ontodb-linux-amd64/*
            ontodb-linux-arm64/*
            ontodb-windows-amd64.exe/*
            ontodb-macos-amd64/*
            ontodb-macos-arm64/*
          generate_release_notes: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test -p onto-core -p onto-storage -p onto-ontology -p onto-query -p onto-graph -p onto-enterprise -p onto-sharding -p onto-raft -p onto-cli
