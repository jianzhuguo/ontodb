[package]
name = "ontodb-rules"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "OntoDB Rules API Server — basic DSL rule management with hot reload"

[[bin]]
name = "ontodb-rules"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
chrono = "0.4"
