apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontodb
  namespace: ontodb
  labels:
    app.kubernetes.io/name: ontodb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontodb
  strategy:
    type: Recreate  # Use Recreate for stateful applications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontodb
        app.kubernetes.io/component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ontodb
          image: ontodb:latest  # Change to your image
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp
              containerPort: 6500
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ontodb-config
          args:
            - "--data-dir=/data/ontodb"
            - "--http=0.0.0.0:8080"
            - "--listen=0.0.0.0:6500"
          volumeMounts:
            - name: data
              mountPath: /data/ontodb
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ontodb-data
