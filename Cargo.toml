[workspace]
resolver = "2"
members = [
    "crates/onto-core",
    "crates/onto-storage",
    "crates/onto-ontology",
    "crates/onto-query",
    "crates/onto-raft",
    "crates/onto-sharding",
    "crates/onto-server",
    "crates/onto-cli",
    "crates/onto-graph",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["OntoDB Team"]
repository = "https://github.com/ontodb/ontodb"
description = "OntoDB - An ontology-driven semantic multi-modal database"

[workspace.dependencies]
# Internal crates
onto-core     = { path = "crates/onto-core" }
onto-storage  = { path = "crates/onto-storage" }
onto-ontology = { path = "crates/onto-ontology" }
onto-query    = { path = "crates/onto-query" }
onto-raft     = { path = "crates/onto-raft" }
onto-graph    = { path = "crates/onto-graph" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.14"
bincode = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
criterion = "0.5"
tempfile = "3"

# CRC
crc32fast = "1"

# Compression
zstd = "0.13"

# Random
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
