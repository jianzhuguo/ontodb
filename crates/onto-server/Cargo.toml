[package]
name = "onto-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OntoDB server"

[[bin]]
name = "ontodb-server"
path = "src/main.rs"

[dependencies]
onto-core = { workspace = true }
onto-storage = { workspace = true }
onto-query = { workspace = true }
onto-graph = { workspace = true }
onto-ontology = { workspace = true }
onto-raft = { path = "../onto-raft", optional = true }
onto-enterprise = { path = "../onto-enterprise", optional = true }
onto-sharding = { path = "../onto-sharding", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
# TLS support
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Certificate generation
rcgen = "0.13"
# X.509 certificate parsing
x509-parser = "0.16"
# Cryptographic hashing (audit integrity chain)
sha2 = "0.10"
# MD5 for PostgreSQL wire protocol authentication
md5 = "0.7"
# Date/time for security audit timestamps
chrono = "0.4"
# Random number generation (PG Wire secret)
rand = { workspace = true }

# CDC publishers (optional, behind cdc-kafka / cdc-webhook)
rdkafka = { version = "0.36", optional = true }
reqwest = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []

# === Feature flags control RUNTIME behavior, not compilation ===
# onto-ontology (basic reasoning) is always included
# Enterprise features are optional

raft = ["dep:onto-raft"]
sharding = ["dep:onto-sharding"]
enterprise = ["dep:onto-enterprise", "onto-graph/enterprise", "onto-query/enterprise", "onto-query/sharding"]
# CDC publishers: rdkafka needs the native librdkafka toolchain, reqwest is pure
# Rust. Opt-in only; kept out of the enterprise-gov bundle.
cdc-kafka = ["dep:rdkafka"]
cdc-webhook = ["dep:reqwest"]
# encryption/audit-retention gate runtime behavior in onto-server AND the
# corresponding onto-enterprise modules, so both sides must light up together.
encryption = ["onto-enterprise/encryption"]
audit-retention = ["onto-enterprise/audit-retention"]

# === Enterprise Bundles ===
# Must forward onto-enterprise's own bundles: current_tier() is decided by
# onto-enterprise's compiled features (enterprise-gov / enterprise-standard).
enterprise-standard = ["enterprise", "raft", "sharding", "onto-enterprise/enterprise-standard"]
enterprise-gov = ["enterprise", "raft", "sharding", "encryption", "audit-retention", "onto-enterprise/enterprise-gov"]
