global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "ontodb"
    metrics_path: /metrics
    static_configs:
      - targets: ["ontodb:7912"]
        labels:
          service: "ontodb"
          environment: "production"

  # Node exporter for OS-level metrics (CPU, disk, network)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node"
