[package]
name = "onto-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Graph data model and traversal engine for OntoDB"

[features]
default = []
# Enterprise features: distributed, streaming, GNN, reasoning, pattern matching
enterprise = ["rayon"]

[dependencies]
onto-core = { workspace = true }
onto-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = "0.12"
# Rayon only required for enterprise parallel features
rayon = { version = "1.10", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "graph_vector_recall"
harness = false
