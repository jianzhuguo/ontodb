<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OntoDB Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1b26;--bg-s:#24283b;--bg-h:#292e42;--bd:#3b4261;--tx:#c0caf5;--dim:#565f89;--ac:#7aa2f7;--gn:#9ece6a;--rd:#f7768e;--yw:#e0af68;--pu:#bb9af7}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg-s);border-bottom:1px solid var(--bd)}
.hdr h1{font-size:16px;font-weight:600}.hdr h1 span{color:var(--ac)}
.st{display:flex;align-items:center;gap:12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--gn)}.dot.err{background:var(--rd)}
.main{display:flex;flex:1;overflow:hidden}
.side{width:260px;background:var(--bg-s);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.side .stitle{padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);border-bottom:1px solid var(--bd)}
.slist{flex:1;overflow-y:auto;padding:4px 0}
.ci{padding:6px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}.ci:hover{background:var(--bg-h)}.ci .ic{font-size:11px;color:var(--pu)}
.cols{padding:0 12px 6px 28px;display:none}.cols.open{display:block}
.cit{font-size:12px;padding:2px 0;color:var(--dim);display:flex;justify-content:space-between}.cty{color:var(--yw);font-size:11px}
.sbtn{padding:8px 12px;border-top:1px solid var(--bd)}.sbtn button{width:100%;padding:6px;background:var(--bg-h);border:1px solid var(--bd);color:var(--tx);border-radius:4px;cursor:pointer;font-size:12px}.sbtn button:hover{background:var(--ac)22}
/* Database tree */
.db-group{border-bottom:1px solid var(--bd)}
.db-head{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ac);background:var(--bg-h)}.db-head:hover{background:#2d3250}
.db-arrow{font-size:9px;width:12px;text-align:center;color:var(--dim);flex-shrink:0;transition:transform .15s}
.db-icon{font-size:14px;flex-shrink:0}
.db-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-count{font-size:10px;color:var(--dim);background:var(--bg);padding:1px 6px;border-radius:3px;flex-shrink:0}
.db-body{}
.tbl-group{border-bottom:1px solid #2a2e42}
.tbl-head{display:flex;align-items:center;gap:5px;padding:5px 10px 5px 22px;cursor:pointer;font-size:12px;color:var(--tx)}.tbl-head:hover{background:var(--bg-h)}
.tbl-arrow{font-size:8px;width:10px;text-align:center;color:var(--dim);flex-shrink:0}
.tbl-icon{font-size:12px;flex-shrink:0;opacity:.6}
.tbl-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tbl-ext{font-size:9px;color:var(--dim);margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px;flex-shrink:0}
.tbl-count{font-size:9px;color:var(--dim);background:var(--bg);padding:0 5px;border-radius:3px;flex-shrink:0;min-width:16px;text-align:center}
.tbl-cols{padding:2px 0 4px 0}
.col-row{display:flex;align-items:center;gap:5px;padding:2px 10px 2px 38px;font-size:11px;color:var(--dim)}.col-row:hover{background:var(--bg-h)}
.col-icon{font-size:8px;flex-shrink:0;color:var(--pu)}
.col-name{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}.col-name:hover{color:var(--ac);text-decoration:underline}
.col-type{font-size:10px;flex-shrink:0;font-family:monospace}
.cnt{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;background:var(--bg-s);border-bottom:1px solid var(--bd)}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--dim)}.tab:hover{color:var(--tx)}.tab.a{color:var(--ac);border-bottom-color:var(--ac)}
.ea{display:flex;flex-direction:column;height:200px;min-height:100px;border-bottom:3px solid var(--bd)}
#editor{flex:1;background:#282a36;color:#f8f8f2;border:none;padding:12px;font:14px 'Consolas','Courier New',monospace;resize:none;outline:none;tab-size:2}
.etool{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-s);border-bottom:1px solid var(--bd)}
.etool button{padding:5px 14px;background:var(--ac);color:#1a1b26;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}.etool button:hover{opacity:.9}
.etool .sb{background:var(--bg-h);color:var(--tx);border:1px solid var(--bd);font-weight:400;padding:4px 10px;font-size:12px}
.etool .inf{margin-left:auto;font-size:12px;color:var(--dim)}
.res{flex:1;overflow:auto}
.res .msg{padding:20px;text-align:center;color:var(--dim);font-size:14px}
.res .err{padding:16px;color:var(--rd);font-size:13px;background:#f7768e18;border-left:3px solid var(--rd);margin:12px}
.res table{width:100%;border-collapse:collapse;font-size:13px}
.res th{position:sticky;top:0;background:var(--bg-s);padding:8px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--bd);color:var(--ac);font-size:12px}
.res td{padding:6px 12px;border-bottom:1px solid var(--bd);max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res tr:hover td{background:var(--bg-h)}
.res .meta{padding:8px 12px;font-size:12px;color:var(--dim);background:var(--bg-s);border-top:1px solid var(--bd);position:sticky;bottom:0}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px}
.mc{background:var(--bg-s);border:1px solid var(--bd);border-radius:8px;padding:16px}.mc .lb{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin-bottom:4px}.mc .vl{font-size:24px;font-weight:700;color:var(--ac)}
.ga{padding:16px}.gc{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.gc input{padding:6px 10px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:4px;font-size:13px}
.gc button{padding:6px 14px;background:var(--ac);color:#1a1b26;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.gr{background:var(--bg-s);border:1px solid var(--bd);border-radius:8px;padding:16px;font-size:13px}
.gv{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--ac)22;border:1px solid var(--ac);border-radius:20px;margin:4px;font-size:12px}
.hl{padding:8px 0}.hi{padding:6px 12px;font-size:12px;cursor:pointer;font-family:monospace;color:var(--dim);border-bottom:1px solid var(--bd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hi:hover{background:var(--bg-h);color:var(--tx)}
.sgr{font-size:10px;color:var(--ac);padding:6px 12px;cursor:pointer}.sgr:hover{background:var(--bg-h)}
</style>
</head>
<body>
<div class="hdr">
  <h1><span>OntoDB</span> Console</h1>
  <div class="st"><div class="dot" id="sdot"></div><span id="stxt">Connecting...</span><span id="sver" style="color:var(--dim)"></span></div>
</div>
<div class="main">
  <div class="side">
    <div class="stitle">Schema</div>
    <div class="slist" id="slist"></div>
    <div class="sbtn"><button onclick="loadSchema()">Refresh Schema</button></div>
  </div>
  <div class="cnt">
    <div class="tabs">
      <div class="tab a" data-tab="query">Query</div>
      <div class="tab" data-tab="metrics">Metrics</div>
      <div class="tab" data-tab="graph">Graph</div>
      <div class="tab" data-tab="history">History</div>
    </div>
    <div id="tab-query" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="ea">
        <div class="etool">
          <button onclick="run()">Run Query</button>
          <button class="sb" onclick="E.value=''">Clear</button>
          <span style="color:var(--dim);font-size:11px;margin-left:4px">OntoQL:</span>
          <button class="sb" onclick="E.value='CREATE CLASS '">CLASS</button>
          <button class="sb" onclick="E.value='CREATE CLASS  EXTENDS '">EXTENDS</button>
          <button class="sb" onclick="E.value='INSERT INTO  SET  = '">INSERT</button>
          <button class="sb" onclick="E.value='SELECT * FROM '">SELECT</button>
          <button class="sb" onclick="E.value='EXPLAIN SELECT * FROM '">EXPLAIN</button>
          <span style="color:var(--dim);font-size:11px;margin-left:8px">Triple:</span>
          <button class="sb" onclick="E.value='INSERT TRIPLE SET subject=\u0022\u0022, predicate=\u0022\u0022, object=\u0022\u0022'">INS</button>
          <button class="sb" onclick="E.value='SELECT TRIPLE'">QUERY</button>
          <span class="inf" id="qi">Ctrl+Enter to run</span>
        </div>
        <textarea id="editor" spellcheck="false">SELECT * FROM Department LIMIT 5</textarea>
      </div>
      <div class="res" id="res">
        <div class="msg">Enter a query and press Run or Ctrl+Enter<br><span style="font-size:12px;color:var(--dim);margin-top:8px;display:inline-block">Supports <b>OntoQL</b> (CREATE CLASS, INSERT SET, SELECT, EXPLAIN) and SQL</span></div>
      </div>
    </div>
    <div id="tab-metrics" style="display:none;flex:1;overflow:auto"><div class="mg" id="mg"></div></div>
    <div id="tab-graph" style="display:none;flex:1;overflow:auto">
      <div class="ga">
        <div class="gc">
          <input id="gvid" placeholder="Vertex ID"/>
          <button onclick="gv()">Get Vertex</button>
          <button onclick="gn()">Neighbors</button>
          <input id="gtstart" placeholder="Start vertex"/>
          <input id="gtdepth" placeholder="Depth" value="2" style="width:60px"/>
          <button onclick="gt()">Traverse</button>
        </div>
        <div class="gr" id="gr"><div class="msg">Enter a vertex ID to explore the graph</div></div>
      </div>
    </div>
    <div id="tab-history" style="display:none;flex:1;overflow:auto"><div class="hl" id="hl"><div class="msg" style="padding:20px">No queries yet</div></div></div>
  </div>
</div>
<script>
var API=window.location.origin,E=document.getElementById('editor'),H=[];
try{H=JSON.parse(localStorage.getItem('ontodb_h')||'[]')}catch(e){}

// Tabs
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('a')});
    ['query','metrics','graph','history'].forEach(function(x){document.getElementById('tab-'+x).style.display='none'});
    t.classList.add('a');
    document.getElementById('tab-'+t.dataset.tab).style.display=t.dataset.tab==='query'?'flex':'block';
    if(t.dataset.tab==='metrics')lm();
    if(t.dataset.tab==='history')lh();
  };
});

// API
function api(m,p,b){
  var h={'Content-Type':'application/json'},o={method:m,headers:h};
  if(b)o.body=JSON.stringify(b);
  return fetch(API+p,o).then(function(r){return r.json()});
}

// Health
function ck(){
  api('GET','/api/health').then(function(d){
    document.getElementById('sdot').className='dot';
    document.getElementById('stxt').textContent='Connected';
    document.getElementById('sver').textContent='v'+(d.version||'?');
  }).catch(function(){
    document.getElementById('sdot').className='dot err';
    document.getElementById('stxt').textContent='Disconnected';
  });
}

// Schema — 三层树：本体(数据库) → 类(表) → 属性(字段)
var SD=null;
function loadSchema(){
  api('GET','/api/schema').then(function(d){
    SD=d.data||d;rs();
  }).catch(function(){
    document.getElementById('slist').innerHTML='<div style="padding:12px;color:var(--rd);font-size:12px">Failed to load</div>';
  });
}

function rs(){
  var L=document.getElementById('slist');
  if(!SD||!SD.ontologies||!SD.ontologies.length){L.innerHTML='<div style="padding:12px;color:var(--dim);font-size:12px">No classes found.</div>';return;}

  // Collect all ontologies with classes, build a global property lookup
  var allProps={};
  var groups=[];
  SD.ontologies.forEach(function(o){
    var cls=o.classes||{};
    // Collect ontology-level properties
    Object.keys(o.properties||{}).forEach(function(p){allProps[p]=o.properties[p];});
    var cn=Object.keys(cls).length;
    if(cn>0)groups.push({name:o.name,classes:cls,props:o.properties||{},count:cn});
  });
  // Sort: multi-class first (by count desc), then single-class
  groups.sort(function(a,b){
    if(a.count>1&&b.count<=1)return -1;
    if(a.count<=1&&b.count>1)return 1;
    return b.count-a.count;
  });

  // Also collect inherited properties for each class
  function getClassCols(clsName, clsObj, ontProps){
    var seen={};
    var cols=[];
    // Extract pure class name (strip " EXTENDS ..." suffix from schema API)
    var pureName=clsName.split(/\s+EXTENDS\s+/)[0].trim();
    // Class-level properties
    (clsObj.properties||[]).forEach(function(p){
      if(!seen[p]){seen[p]=1;var pi=ontProps[p]||allProps[p];cols.push({name:p,type:pi?pi.range:'?'});}
    });
    // Ontology-level properties where domain matches this class (by pure name)
    Object.keys(ontProps).forEach(function(p){
      var d=ontProps[p].domain||'';
      if(!seen[p]&&(d===pureName||d===clsName)){seen[p]=1;cols.push({name:p,type:ontProps[p].range||'?'});}
    });
    return cols;
  }

  var h='';
  groups.forEach(function(g){
    var clsNames=Object.keys(g.classes);

    // Ontology header (like database name)
    h+='<div class="db-group">';
    h+='<div class="db-head" onclick="tg(this)">';
    h+='<span class="db-arrow">\u25b6</span>';
    h+='<span class="db-icon">\ud83d\udce6</span>'; // 📦 ontology icon
    h+='<span class="db-name">'+g.name+'</span>';
    h+='<span class="db-count">'+g.count+' \u7c7b</span>'; // 类
    h+='</div>';
    h+='<div class="db-body" style="display:none">';

    // Classes (like tables)
    clsNames.forEach(function(cn){
      var cls=g.classes[cn];
      var sp=cls.superclasses||[];
      // Display name: strip " EXTENDS ..." suffix
      var displayCn=cn.split(/\s+EXTENDS\s+/)[0].trim();
      var cols=getClassCols(cn,cls,g.props);
      var colCount=cols.length;

      h+='<div class="tbl-group">';
      h+='<div class="tbl-head" onclick="tg(this)">';
      h+='<span class="tbl-arrow">\u25b6</span>';
      h+='<span class="tbl-icon">\ud83d\udd37</span>'; // 🔷 class icon
      h+='<span class="tbl-name">'+displayCn+'</span>';
      if(sp.length)h+='<span class="tbl-ext" title="extends '+sp[0]+'">\u2190 '+sp[0]+'</span>';
      h+='<span class="tbl-count">'+colCount+'</span>';
      h+='</div>';

      // Properties (like columns)
      if(colCount>0){
        h+='<div class="tbl-cols" style="display:none">';
        cols.forEach(function(c){
          var typeColor=c.type==='STRING'?'#9ece6a':c.type==='INT64'?'#7aa2f7':c.type==='FLOAT64'?'#bb9af7':c.type==='BOOL'?'#f7768e':'#565f89';
          h+='<div class="col-row">';
          h+='<span class="col-icon">\u2022</span>';
          h+='<span class="col-name" onclick="E.value=\'SELECT '+c.name+' FROM '+cn+' LIMIT 10\';run()" title="Click to query">'+c.name+'</span>';
          h+='<span class="col-type" style="color:'+typeColor+'">'+c.type+'</span>';
          h+='</div>';
        });
        h+='</div>';
      }else{
        h+='<div class="tbl-cols" style="display:none"><div class="col-row" style="color:var(--dim);font-style:italic">No properties defined</div></div>';
      }
      h+='</div>'; // tbl-group
    });
    h+='</div></div>'; // db-body, db-group
  });
  L.innerHTML=h;
}

// Toggle expand/collapse
function tg(el){
  var body=el.nextElementSibling;
  var arrow=el.querySelector('.db-arrow,.tbl-arrow');
  if(body.style.display==='none'){
    body.style.display='block';
    if(arrow)arrow.textContent='\u25bc';
  }else{
    body.style.display='none';
    if(arrow)arrow.textContent='\u25b6';
  }
}

// Query
function run(){
  var q=E.value.trim();if(!q)return;
  var t0=performance.now(),R=document.getElementById('res');
  R.innerHTML='<div class="msg">Running...</div>';
  api('POST','/api/query',{query:q}).then(function(d){
    var ms=performance.now()-t0;ah(q);
    if(d.error)R.innerHTML='<div class="err">'+eh(d.error)+'</div>';
    else if(d.data&&Array.isArray(d.data))rt(d.data,ms,d.elapsed_ms);
    else if(d.data&&d.data.message)R.innerHTML='<div class="msg">'+eh(d.data.message)+'</div><div class="meta">'+ms.toFixed(1)+'ms</div>';
    else R.innerHTML='<div class="msg">OK</div><div class="meta">'+ms.toFixed(1)+'ms</div>';
    document.getElementById('qi').textContent=ms.toFixed(0)+'ms';
  }).catch(function(e){R.innerHTML='<div class="err">Network error: '+eh(e.message)+'</div>';});
}

function rt(rows,cMs,sMs){
  if(!rows.length){document.getElementById('res').innerHTML='<div class="msg">No results</div>';return;}
  var cols=Object.keys(rows[0]),h='<table><thead><tr>';
  cols.forEach(function(c){h+='<th>'+eh(c)+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr>';
    cols.forEach(function(c){
      var v=r[c];
      if(v===null||v===undefined)v='<span style="color:var(--dim)">NULL</span>';
      else if(typeof v==='object')v=eh(JSON.stringify(v));
      else v=eh(String(v));
      h+='<td>'+v+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  h+='<div class="meta">'+rows.length+' row'+(rows.length!==1?'s':'')+' | client: '+cMs.toFixed(1)+'ms'+(sMs?' | server: '+sMs.toFixed(1)+'ms':'')+'</div>';
  document.getElementById('res').innerHTML=h;
}

// Metrics
function lm(){
  api('GET','/api/metrics').then(function(d){
    var d=d.data||d,g=document.getElementById('mg');
    g.innerHTML=mc('Queries Total',d.queries?d.queries.total:0)
      +mc('SELECT',d.queries&&d.queries.by_type?d.queries.by_type.select:0)
      +mc('INSERT',d.queries&&d.queries.by_type?d.queries.by_type.insert:0)
      +mc('UPDATE',d.queries&&d.queries.by_type?d.queries.by_type.update:0)
      +mc('DELETE',d.queries&&d.queries.by_type?d.queries.by_type.delete:0)
      +mc('Vector Search',d.queries&&d.queries.by_type?d.queries.by_type.vector_search:0)
      +mc('Errors',d.queries?d.queries.errors:0,'var(--rd)')
      +mc('SSTables',d.storage?d.storage.sstable_count:0)
      +mc('Entries',d.storage?d.storage.entries:0)
      +mc('Compactions',d.storage?d.storage.compactions:0)
      +mc('HTTP Conns',d.connections&&d.connections.http?d.connections.http.active+' active':'-')
      +mc('Uptime',fu(d.server?d.server.uptime_seconds:0));
  }).catch(function(e){document.getElementById('mg').innerHTML='<div class="msg">Failed: '+e.message+'</div>';});
}
function mc(l,v,c){return '<div class="mc"><div class="lb">'+l+'</div><div class="vl"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div></div>';}
function fu(s){if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h';}

// Graph
function gv(){
  var id=document.getElementById('gvid').value.trim();if(!id)return;
  api('GET','/api/graph/vertex/'+encodeURIComponent(id)).then(function(d){
    var d=d.data||d;
    document.getElementById('gr').innerHTML='<div><span class="gv">'+eh(d.id||id)+'</span></div><div style="margin-top:8px"><b>Labels:</b> '+(d.labels||[]).join(', ')+'</div><div><b>Properties:</b></div><pre style="font-size:12px;color:var(--dim);margin-top:4px">'+eh(JSON.stringify(d.properties||{},null,2))+'</pre>';
  });
}
function gn(){
  var id=document.getElementById('gvid').value.trim();if(!id)return;
  api('GET','/api/graph/neighbors/'+encodeURIComponent(id)).then(function(d){
    var d=d.data||d,h='<div style="margin-bottom:8px"><b>Neighbors of '+eh(id)+'</b> ('+(d.count||0)+')</div>';
    (d.neighbors||[]).forEach(function(n){h+='<div class="gv">'+eh(n.id)+' <span style="color:var(--dim);font-size:11px">('+(n.labels||[]).join(',')+')</span></div>';});
    document.getElementById('gr').innerHTML=h;
  });
}
function gt(){
  var s=document.getElementById('gtstart').value.trim(),d=parseInt(document.getElementById('gtdepth').value)||2;if(!s)return;
  api('POST','/api/graph/traverse',{start:s,direction:'out',max_depth:d}).then(function(r){
    var r=r.data||r,h='<div style="margin-bottom:8px"><b>Traversal from '+eh(s)+'</b> (depth '+d+', visited '+(r.visited_count||0)+')</div>';
    (r.vertices||[]).forEach(function(v){h+='<div class="gv">'+eh(v.id)+' <span style="color:var(--dim);font-size:11px">('+(v.labels||[]).join(',')+')</span></div>';});
    document.getElementById('gr').innerHTML=h;
  });
}

// History
function ah(q){H.unshift(q);if(H.length>100)H.pop();localStorage.setItem('ontodb_h',JSON.stringify(H));}
function lh(){
  var L=document.getElementById('hl');
  if(!H.length){L.innerHTML='<div class="msg" style="padding:20px">No queries yet</div>';return;}
  L.innerHTML=H.map(function(q,i){return '<div class="hi" onclick="E.value=H['+i+']">'+eh(q)+'</div>';}).join('');
}

function eh(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// Ctrl+Enter
E.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run();}});

// Init
ck();loadSchema();setInterval(ck,30000);
</script>
</body>
