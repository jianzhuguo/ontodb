apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ontodb
  namespace: ontodb
  labels:
    app.kubernetes.io/name: ontodb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ontodb
  minReplicas: 1
  # maxReplicas MUST be 1 until Raft consensus is functional.
  # Multiple replicas with isolated storage will cause data inconsistency.
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
