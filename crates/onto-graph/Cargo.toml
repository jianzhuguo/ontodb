[package]
name = "onto-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Graph data model and traversal engine for OntoDB"

[features]
default = []
# Vestigial: kept so onto-server/onto-query feature chains keep resolving.
# Graph engine is edition-uniform (v0.5.2).
enterprise = []

[dependencies]
onto-core = { workspace = true }
onto-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = "0.12"
rayon = "1.10"

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "graph_vector_recall"
harness = false
