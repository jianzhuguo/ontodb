[workspace]
resolver = "2"
members = [
    "crates/onto-core",
    "crates/onto-storage",
    "crates/onto-ontology",
    "crates/onto-query",
    "crates/onto-server",
    "crates/onto-cli",
    "crates/onto-graph",
    "crates/onto-plugin",
    "crates/onto-edge",
    "crates/onto-edge-bin",
    "crates/ontodb-rules",
    "tools/migrate-namespace",
    "tools/check_sst",
    "tools/migrate_sst_format",
    "tools/recover_data",
    "tools/fix_key_prefix",
    "tools/clean_index",
]

[workspace.package]
version = "0.6.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Guo Jianzhu (郭建筑) <624831343@qq.com>"]
repository = "https://gitee.com/ontovalue/ontodb"
description = "OntoDB - An ontology-driven semantic multi-modal database"

[workspace.dependencies]
# Internal crates
onto-core     = { path = "crates/onto-core" }
onto-storage  = { path = "crates/onto-storage" }
onto-ontology = { path = "crates/onto-ontology" }
onto-query    = { path = "crates/onto-query" }
onto-graph     = { path = "crates/onto-graph" }
onto-plugin   = { path = "crates/onto-plugin" }
# Enterprise-only (private, not in this repo):
# onto-raft, onto-sharding, onto-enterprise — see crates/onto-server/Cargo.toml

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.14"
bincode = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Testing
criterion = "0.5"
tempfile = "3"

# CRC
crc32fast = "1"

# Compression
zstd = "0.13"

# Encoding
base64 = "0.21"

# Random
rand = "0.8"

# Time
chrono = "0.4"

[profile.release]
opt-level = 3
codegen-units = 1
strip = false
debug = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Vendored zstd-sys with patches for two zstd 1.5.7 bugs:
# 1. ZSTD_decompressBegin: reset litBuffer/litBufferEnd/litBufferLocation/litPtr/litSize
# 2. HUF_isError check before ZSTD_split adjustment (don't mutate state on error)
[patch.crates-io]
zstd-sys = { path = "vendor/zstd-sys" }
