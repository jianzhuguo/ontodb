apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontodb.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: tcp
      port: {{ .Values.service.tcp.port }}
      targetPort: tcp
      protocol: TCP
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ontodb.selectorLabels" . | nindent 4 }}
