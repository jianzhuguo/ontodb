<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OntoDB Console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1a1b26; --bg-surface: #24283b; --bg-hover: #292e42;
  --border: #3b4261; --text: #c0caf5; --text-dim: #565f89;
  --accent: #7aa2f7; --accent-dim: #3d59a1;
  --green: #9ece6a; --red: #f7768e; --yellow: #e0af68; --purple: #bb9af7;
}
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
a { color: var(--accent); text-decoration: none; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border); }
.header h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.header h1 span { color: var(--accent); }
.header .status { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.header .status .dot.error { background: var(--red); }

/* Main layout */
.main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar { width: 260px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar .section-title { padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.sidebar .schema-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.sidebar .class-item { padding: 6px 12px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.sidebar .class-item:hover { background: var(--bg-hover); }
.sidebar .class-item.active { background: var(--accent-dim); color: var(--accent); }
.sidebar .class-item .icon { font-size: 11px; color: var(--purple); }
.sidebar .columns { padding: 0 12px 6px 28px; display: none; }
.sidebar .columns.open { display: block; }
.sidebar .col-item { font-size: 12px; padding: 2px 0; color: var(--text-dim); display: flex; justify-content: space-between; }
.sidebar .col-type { color: var(--yellow); font-size: 11px; }
.sidebar .refresh-btn { padding: 8px 12px; border-top: 1px solid var(--border); }
.sidebar .refresh-btn button { width: 100%; padding: 6px; background: var(--bg-hover); border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer; font-size: 12px; }
.sidebar .refresh-btn button:hover { background: var(--accent-dim); }

/* Editor + Results */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Tabs */
.tabs { display: flex; background: var(--bg-surface); border-bottom: 1px solid var(--border); }
.tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-dim); }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Editor area */
.editor-area { display: flex; flex-direction: column; height: 200px; min-height: 100px; border-bottom: 3px solid var(--border); position: relative; }
.editor-area .CodeMirror { height: 100%; font-size: 14px; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
.editor-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-surface); border-bottom: 1px solid var(--border); }
.editor-toolbar button { padding: 5px 14px; background: var(--accent); color: #1a1b26; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.editor-toolbar button:hover { opacity: 0.9; }
.editor-toolbar button.secondary { background: var(--bg-hover); color: var(--text); border: 1px solid var(--border); }
.editor-toolbar .info { margin-left: auto; font-size: 12px; color: var(--text-dim); }

/* Results area */
.results-area { flex: 1; overflow: auto; padding: 0; }
.results-area .message { padding: 20px; text-align: center; color: var(--text-dim); font-size: 14px; }
.results-area .error { padding: 16px; color: var(--red); font-size: 13px; background: rgba(247,118,142,0.1); border-left: 3px solid var(--red); margin: 12px; }
.results-area table { width: 100%; border-collapse: collapse; font-size: 13px; }
.results-area th { position: sticky; top: 0; background: var(--bg-surface); padding: 8px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); color: var(--accent); font-size: 12px; }
.results-area td { padding: 6px 12px; border-bottom: 1px solid var(--border); max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results-area tr:hover td { background: var(--bg-hover); }
.results-area .meta { padding: 8px 12px; font-size: 12px; color: var(--text-dim); background: var(--bg-surface); border-top: 1px solid var(--border); position: sticky; bottom: 0; }

/* Metrics tab */
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; padding: 16px; }
.metric-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.metric-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 4px; }
.metric-card .value { font-size: 24px; font-weight: 700; color: var(--accent); }
.metric-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* Graph tab */
.graph-area { padding: 16px; }
.graph-controls { display: flex; gap: 8px; margin-bottom: 12px; }
.graph-controls input { padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 13px; }
.graph-controls button { padding: 6px 14px; background: var(--accent); color: #1a1b26; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.graph-result { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-size: 13px; }
.graph-vertex { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 20px; margin: 4px; font-size: 12px; }
.graph-edge { color: var(--text-dim); font-size: 12px; margin: 2px 0; }

/* History */
.history-list { padding: 8px 0; }
.history-item { padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: monospace; color: var(--text-dim); border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-item:hover { background: var(--bg-hover); color: var(--text); }
</style>
</head>
<body>

<div class="header">
  <h1><span>OntoDB</span> Console</h1>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Connecting...</span>
    <span id="versionText" style="color:var(--text-dim)"></span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="section-title">Schema</div>
    <div class="schema-list" id="schemaList"></div>
    <div class="refresh-btn">
      <button onclick="loadSchema()">Refresh Schema</button>
    </div>
  </div>

  <div class="content">
    <div class="tabs">
      <div class="tab active" data-tab="query">Query</div>
      <div class="tab" data-tab="metrics">Metrics</div>
      <div class="tab" data-tab="graph">Graph</div>
      <div class="tab" data-tab="history">History</div>
    </div>

    <div id="tab-query" class="tab-content" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="editor-area">
        <div class="editor-toolbar">
          <button onclick="executeQuery()">Run Query</button>
          <button class="secondary" onclick="editor.setValue('')">Clear</button>
          <button class="secondary" onclick="editor.setValue('SELECT * FROM ')">SELECT</button>
          <button class="secondary" onclick="editor.setValue('INSERT INTO ')">INSERT</button>
          <button class="secondary" onclick="editor.setValue('CREATE CLASS ')">CREATE</button>
          <span class="info" id="queryInfo">Ctrl+Enter to run</span>
        </div>
        <textarea id="editor"></textarea>
      </div>
      <div class="results-area" id="results">
        <div class="message">Enter a query and press Run or Ctrl+Enter</div>
      </div>
    </div>

    <div id="tab-metrics" class="tab-content" style="display:none;flex:1;overflow:auto">
      <div class="metrics-grid" id="metricsGrid"></div>
    </div>

    <div id="tab-graph" class="tab-content" style="display:none;flex:1;overflow:auto">
      <div class="graph-area">
        <div class="graph-controls">
          <input id="graphVertexId" placeholder="Vertex ID" />
          <button onclick="graphGetVertex()">Get Vertex</button>
          <button onclick="graphGetNeighbors()">Neighbors</button>
          <input id="graphTraverseStart" placeholder="Start vertex" />
          <input id="graphTraverseDepth" placeholder="Depth" value="2" style="width:60px" />
          <button onclick="graphTraverse()">Traverse</button>
        </div>
        <div class="graph-result" id="graphResult">
          <div class="message">Enter a vertex ID to explore the graph</div>
        </div>
      </div>
    </div>

    <div id="tab-history" class="tab-content" style="display:none;flex:1;overflow:auto">
      <div class="history-list" id="historyList">
        <div class="message" style="padding:20px;text-align:center;color:var(--text-dim)">No queries yet</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/sql-hint.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<script>
const API = window.location.origin;
let apiKey = localStorage.getItem('ontodb_api_key') || '';
let queryHistory = JSON.parse(localStorage.getItem('ontodb_history') || '[]');
let schemaData = null;

// CodeMirror editor
const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
  mode: 'text/x-sql', theme: 'dracula', lineNumbers: true,
  indentWithTabs: false, smartIndent: true, autofocus: true,
  extraKeys: {
    'Ctrl-Enter': () => executeQuery(),
    'Cmd-Enter': () => executeQuery(),
    'Ctrl-Space': 'autocomplete',
  },
  hintOptions: { completeSingle: false },
});
editor.setSize(null, '100%');

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).style.display = tab.dataset.tab === 'query' ? 'flex' : 'block';
    if (tab.dataset.tab === 'metrics') loadMetrics();
  });
});

// API helper
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (apiKey) headers['X-API-Key'] = apiKey;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(API + path, opts);
  return resp.json();
}

// Health check
async function checkHealth() {
  try {
    const data = await api('GET', '/api/health');
    document.getElementById('statusDot').className = 'dot';
    document.getElementById('statusText').textContent = 'Connected';
    document.getElementById('versionText').textContent = 'v' + (data.version || '?');
  } catch {
    document.getElementById('statusDot').className = 'dot error';
    document.getElementById('statusText').textContent = 'Disconnected';
  }
}

// Schema
async function loadSchema() {
  try {
    const data = await api('GET', '/api/schema');
    schemaData = data.data || data;
    renderSchema();
  } catch (e) {
    document.getElementById('schemaList').innerHTML = '<div style="padding:12px;color:var(--red);font-size:12px">Failed to load schema</div>';
  }
}

function renderSchema() {
  const list = document.getElementById('schemaList');
  if (!schemaData || !schemaData.classes || schemaData.classes.length === 0) {
    list.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:12px">No classes found. Create one with CREATE CLASS.</div>';
    return;
  }
  list.innerHTML = schemaData.classes.map(cls => {
    const cols = cls.columns || [];
    return `
      <div class="class-item" onclick="toggleColumns(this)">
        <span class="icon">◆</span> ${cls.name}
      </div>
      <div class="columns">
        ${cols.map(c => `<div class="col-item"><span>${c.name}</span><span class="col-type">${c.data_type}</span></div>`).join('')}
      </div>
    `;
  }).join('');
}

function toggleColumns(el) {
  el.classList.toggle('active');
  const cols = el.nextElementSibling;
  cols.classList.toggle('open');
}

// Query execution
async function executeQuery() {
  const query = editor.getValue().trim();
  if (!query) return;

  const start = performance.now();
  const results = document.getElementById('results');
  results.innerHTML = '<div class="message">Running...</div>';

  try {
    const data = await api('POST', '/api/query', { query });
    const elapsed = performance.now() - start;
    addToHistory(query);

    if (data.error) {
      results.innerHTML = `<div class="error">${escHtml(data.error)}</div>`;
    } else if (data.data && Array.isArray(data.data)) {
      renderTable(data.data, elapsed, data.elapsed_ms);
    } else if (data.data && data.data.message) {
      results.innerHTML = `<div class="message">${escHtml(data.data.message)}</div><div class="meta">${elapsed.toFixed(1)}ms</div>`;
    } else {
      results.innerHTML = `<div class="message">Query executed successfully</div><div class="meta">${elapsed.toFixed(1)}ms</div>`;
    }
    document.getElementById('queryInfo').textContent = `${elapsed.toFixed(0)}ms`;
  } catch (e) {
    results.innerHTML = `<div class="error">Network error: ${escHtml(e.message)}</div>`;
  }
}

function renderTable(rows, clientMs, serverMs) {
  if (rows.length === 0) {
    document.getElementById('results').innerHTML = '<div class="message">No results</div>';
    return;
  }
  const cols = Object.keys(rows[0]);
  let html = '<table><thead><tr>';
  cols.forEach(c => html += `<th>${escHtml(c)}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    cols.forEach(c => {
      let val = row[c];
      if (val === null || val === undefined) val = '<span style="color:var(--text-dim)">NULL</span>';
      else if (typeof val === 'object') val = escHtml(JSON.stringify(val));
      else val = escHtml(String(val));
      html += `<td>${val}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  html += `<div class="meta">${rows.length} row${rows.length !== 1 ? 's' : ''} | client: ${clientMs.toFixed(1)}ms${serverMs ? ' | server: ' + serverMs.toFixed(1) + 'ms' : ''}</div>`;
  document.getElementById('results').innerHTML = html;
}

// Metrics
async function loadMetrics() {
  try {
    const data = await api('GET', '/api/metrics');
    const d = data.data || data;
    const grid = document.getElementById('metricsGrid');
    grid.innerHTML = `
      ${metricCard('Queries Total', d.queries?.total || 0)}
      ${metricCard('SELECT', d.queries?.by_type?.select || 0)}
      ${metricCard('INSERT', d.queries?.by_type?.insert || 0)}
      ${metricCard('UPDATE', d.queries?.by_type?.update || 0)}
      ${metricCard('DELETE', d.queries?.by_type?.delete || 0)}
      ${metricCard('Vector Search', d.queries?.by_type?.vector_search || 0)}
      ${metricCard('Query Errors', d.queries?.errors || 0, 'var(--red)')}
      ${metricCard('Slow Queries', d.slow_queries?.total || 0, 'var(--yellow)')}
      ${metricCard('SSTables', d.storage?.sstable_count || 0)}
      ${metricCard('Storage Entries', d.storage?.entries || 0)}
      ${metricCard('Compactions', d.storage?.compactions || 0)}
      ${metricCard('HTTP Connections', (d.connections?.http?.active || 0) + ' active')}
      ${metricCard('Auth Successes', d.auth?.successes || 0, 'var(--green)')}
      ${metricCard('Auth Failures', d.auth?.failures || 0, 'var(--red)')}
      ${metricCard('Rate Limited', d.rate_limiting?.limited_total || 0)}
      ${metricCard('Uptime', formatUptime(d.server?.uptime_seconds || 0))}
    `;
  } catch (e) {
    document.getElementById('metricsGrid').innerHTML = `<div class="message">Failed to load metrics: ${e.message}</div>`;
  }
}

function metricCard(label, value, color) {
  const style = color ? `color:${color}` : '';
  return `<div class="metric-card"><div class="label">${label}</div><div class="value" style="${style}">${value}</div></div>`;
}

function formatUptime(secs) {
  if (secs < 60) return secs + 's';
  if (secs < 3600) return Math.floor(secs/60) + 'm';
  if (secs < 86400) return Math.floor(secs/3600) + 'h ' + Math.floor((secs%3600)/60) + 'm';
  return Math.floor(secs/86400) + 'd ' + Math.floor((secs%86400)/3600) + 'h';
}

// Graph
async function graphGetVertex() {
  const id = document.getElementById('graphVertexId').value.trim();
  if (!id) return;
  const data = await api('GET', '/api/graph/vertex/' + encodeURIComponent(id));
  const d = data.data || data;
  document.getElementById('graphResult').innerHTML = `
    <div><span class="graph-vertex">${escHtml(d.id || id)}</span></div>
    <div style="margin-top:8px"><b>Labels:</b> ${(d.labels||[]).join(', ') || 'none'}</div>
    <div><b>Properties:</b></div>
    <pre style="font-size:12px;color:var(--text-dim);margin-top:4px">${escHtml(JSON.stringify(d.properties||{}, null, 2))}</pre>
  `;
}

async function graphGetNeighbors() {
  const id = document.getElementById('graphVertexId').value.trim();
  if (!id) return;
  const data = await api('GET', '/api/graph/neighbors/' + encodeURIComponent(id));
  const d = data.data || data;
  let html = `<div style="margin-bottom:8px"><b>Neighbors of ${escHtml(id)}</b> (${d.count || 0})</div>`;
  (d.neighbors || []).forEach(n => {
    html += `<div class="graph-vertex">${escHtml(n.id)} <span style="color:var(--text-dim);font-size:11px">(${(n.labels||[]).join(',')})</span></div>`;
  });
  document.getElementById('graphResult').innerHTML = html;
}

async function graphTraverse() {
  const start = document.getElementById('graphTraverseStart').value.trim();
  const depth = parseInt(document.getElementById('graphTraverseDepth').value) || 2;
  if (!start) return;
  const data = await api('POST', '/api/graph/traverse', { start, direction: 'out', max_depth: depth });
  const d = data.data || data;
  let html = `<div style="margin-bottom:8px"><b>Traversal from ${escHtml(start)}</b> (depth ${depth}, visited ${d.visited_count || 0})</div>`;
  (d.vertices || []).forEach(v => {
    html += `<div class="graph-vertex">${escHtml(v.id)} <span style="color:var(--text-dim);font-size:11px">(${(v.labels||[]).join(',')})</span></div>`;
  });
  document.getElementById('graphResult').innerHTML = html;
}

// History
function addToHistory(query) {
  queryHistory.unshift(query);
  if (queryHistory.length > 100) queryHistory.pop();
  localStorage.setItem('ontodb_history', JSON.stringify(queryHistory));
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (queryHistory.length === 0) {
    list.innerHTML = '<div class="message" style="padding:20px;text-align:center;color:var(--text-dim)">No queries yet</div>';
    return;
  }
  list.innerHTML = queryHistory.map((q, i) =>
    `<div class="history-item" onclick="editor.setValue(queryHistory[${i}])">${escHtml(q)}</div>`
  ).join('');
}

document.querySelector('[data-tab="history"]').addEventListener('click', renderHistory);

// Utils
function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Init
checkHealth();
loadSchema();
setInterval(checkHealth, 30000);

// Auto-complete hints
editor.on('inputRead', (cm, change) => {
  if (change.text[0] && change.text[0].match(/\w/)) {
    CodeMirror.commands.autocomplete(cm, null, { completeSingle: false });
  }
});
</script>
</body>
</html>
