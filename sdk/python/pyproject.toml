[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontodb"
version = "0.1.0"
description = "Python SDK for OntoDB - Ontology-driven semantic multi-modal database"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [
    { name = "OntoDB Team", email = "dev@ontodb.ai" },
]
keywords = ["database", "ontology", "semantic", "vector-search", "sparql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/ontodb/ontodb"
Documentation = "https://github.com/ontodb/ontodb/tree/main/sdk/python"
Repository = "https://github.com/ontodb/ontodb"
Issues = "https://github.com/ontodb/ontodb/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ontodb"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
