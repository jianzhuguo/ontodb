apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ontodb.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontodb.labels" . | nindent 4 }}
data:
  # Storage engine configuration
  STORAGE_DATA_DIR: "/data/ontodb"
  STORAGE_MEMTABLE_SIZE: {{ .Values.config.storageMemtableSize | quote }}
  STORAGE_BLOCK_SIZE: {{ .Values.config.storageBlockSize | quote }}
  STORAGE_NUM_LEVELS: {{ .Values.config.storageNumLevels | quote }}
  STORAGE_COMPRESSION_LEVEL: {{ .Values.config.storageCompressionLevel | quote }}

  # Server configuration
  SERVER_LISTEN: "0.0.0.0:{{ .Values.service.tcp.port }}"
  SERVER_HTTP: "0.0.0.0:{{ .Values.service.http.port }}"

  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPM: {{ .Values.config.rateLimitRpm | quote }}
  RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
