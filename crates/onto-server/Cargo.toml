[package]
name = "onto-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OntoDB server"

[[bin]]
name = "ontodb-server"
path = "src/main.rs"

[dependencies]
onto-core = { workspace = true }
onto-storage = { workspace = true }
onto-query = { workspace = true }
onto-graph = { workspace = true }
onto-ontology = { workspace = true }
onto-raft = { workspace = true }
onto-enterprise = { workspace = true }
onto-sharding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
# TLS support
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Certificate generation
rcgen = "0.13"
# X.509 certificate parsing
x509-parser = "0.16"
# Cryptographic hashing (audit integrity chain)
sha2 = "0.10"
# MD5 for PostgreSQL wire protocol authentication
md5 = "0.7"
# Date/time for security audit timestamps
chrono = "0.4"
# Random number generation (PG Wire secret)
rand = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["ontology", "enterprise", "raft", "sharding"]

# === Feature flags control RUNTIME behavior, not compilation ===
# All code is compiled, but features are only activated when enabled.
# Community edition ships with default features disabled.

ontology = []
raft = []
sharding = []
enterprise = []

# === Enterprise Bundles ===
enterprise-standard = ["enterprise"]
enterprise-gov = ["enterprise"]
