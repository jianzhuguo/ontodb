global:
  resolve_timeout: 5m

# ── 路由策略 ─────────────────────────────────────────────────
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'all-channels'

  routes:
    - match:
        severity: critical
      receiver: 'all-channels'
      repeat_interval: 30m

    - match:
        severity: warning
      receiver: 'all-channels'
      repeat_interval: 4h

    - match:
        severity: info
      receiver: 'all-channels'
      repeat_interval: 12h

# ── 接收器 ───────────────────────────────────────────────────
receivers:
  - name: 'all-channels'

    # ── 邮件 (QQ邮箱 SMTP) ──
    email_configs:
      - to: '624831343@qq.com'
        from: '624831343@qq.com'
        smarthost: 'smtp.qq.com:587'
        auth_username: '624831343@qq.com'
        auth_password: 'tpmyxfhchqbwbcbd'
        require_tls: true
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'

    # ── Slack (未配置，填入 Webhook URL 后启用) ──
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#ontodb-alerts'
    #     send_resolved: true

    # ── 钉钉 (通过 webhook 适配器) ──
    webhook_configs:
      - url: 'http://dingtalk:8060/dingtalk/ops/send'
        send_resolved: true

      # ── 企业微信 (通过 webhook 适配器) ──
      - url: 'http://wechat-webhook:80/wechat/send'
        send_resolved: true

# ── 抑制规则 ─────────────────────────────────────────────────
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
