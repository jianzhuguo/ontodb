<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test</title></head>
<body style="margin:0;background:#040810">
<canvas id="c" style="display:block;width:100vw;height:100vh"></canvas>
<script>
var cv=document.getElementById('c'),cx=cv.getContext('2d');
cv.width=window.innerWidth;cv.height=window.innerHeight;
var w=cv.width,h=cv.height;

// Draw a simple globe
var cx0=w/2,cy0=h/2,R=Math.min(w,h)*0.35;

// Background
cx.fillStyle='#040810';cx.fillRect(0,0,w,h);

// Globe glow
var g=cx.createRadialGradient(cx0,cy0,R*0.2,cx0,cy0,R*1.2);
g.addColorStop(0,'rgba(59,130,246,0.1)');g.addColorStop(1,'rgba(59,130,246,0)');
cx.fillStyle=g;cx.beginPath();cx.arc(cx0,cy0,R*1.2,0,Math.PI*2);cx.fill();

// Globe
cx.beginPath();cx.arc(cx0,cy0,R,0,Math.PI*2);
cx.fillStyle='#0a1628';cx.fill();
cx.strokeStyle='rgba(59,130,246,0.2)';cx.lineWidth=2;cx.stroke();

// Grid
cx.strokeStyle='rgba(59,130,246,0.08)';cx.lineWidth=0.5;
for(var i=-60;i<=60;i+=30){
  var r=R*Math.cos(i*Math.PI/180),y=cy0-R*Math.sin(i*Math.PI/180)*0.5;
  cx.beginPath();cx.ellipse(cx0,y,r,r*0.1,0,0,Math.PI*2);cx.stroke();
}
for(var i=0;i<360;i+=30){
  var a=i*Math.PI/180;
  cx.beginPath();
  for(var t=-90;t<=90;t+=5){
    var lat=t*Math.PI/180;
    var px=cx0+R*Math.cos(lat)*Math.sin(a);
    var py=cy0-R*Math.sin(lat)*0.7;
    if(t===-90)cx.moveTo(px,py);else cx.lineTo(px,py);
  }
  cx.stroke();
}

// China outline (simplified)
var china=[[39.5,117.5],[38,122],[35,120],[31,122],[28,121],[25,118],[22,114],[21,110],[22,107],[25,104],[28,101],[30,99],[33,97],[36,95],[39,96],[42,96],[45,98],[48,101],[49,103],[48,106],[47,108],[46,110],[44,113],[43,115],[42,118],[40,121],[39.5,117.5]];
cx.beginPath();
for(var i=0;i<china.length;i++){
  var lat=china[i][0],lon=china[i][1];
  // Simple mercator-ish projection centered on China
  var px=cx0+(lon-105)*R*0.018;
  var py=cy0-(lat-35)*R*0.022;
  if(i===0)cx.moveTo(px,py);else cx.lineTo(px,py);
}
cx.fillStyle='rgba(59,130,246,0.06)';cx.fill();
cx.strokeStyle='rgba(59,130,246,0.3)';cx.lineWidth=1.5;cx.stroke();

// Cities
var cities=[
  {x:cx0+(120.6-105)*R*0.018,y:cy0-(31.3-35)*R*0.022,label:'苏州 HQ',col:'#3b82f6'},
  {x:cx0+(116.4-105)*R*0.018,y:cy0-(39.9-35)*R*0.022,label:'北京',col:'#3b82f6'},
  {x:cx0+(113.3-105)*R*0.018,y:cy0-(23.1-35)*R*0.022,label:'广州',col:'#3b82f6'},
  {x:cx0+(104.1-105)*R*0.018,y:cy0-(30.6-35)*R*0.022,label:'成都',col:'#3b82f6'},
  {x:cx0+(103.8-105)*R*0.018,y:cy0-(1.3-35)*R*0.022,label:'新加坡',col:'#22c55e'},
  {x:cx0+(55.3-105)*R*0.018,y:cy0-(25.2-35)*R*0.022,label:'迪拜',col:'#eab308'},
  {x:cx0+(8.7-105)*R*0.018,y:cy0-(50.1-35)*R*0.022,label:'法兰克福',col:'#a855f7'},
];

// Draw connections from HQ to all cities
var hq=cities[0];
for(var i=1;i<cities.length;i++){
  var c=cities[i];
  cx.beginPath();cx.moveTo(hq.x,hq.y);cx.lineTo(c.x,c.y);
  cx.strokeStyle='rgba(59,130,246,0.15)';cx.lineWidth=1;cx.stroke();
}

for(var i=0;i<cities.length;i++){
  var c=cities[i];
  // Glow
  var gl=cx.createRadialGradient(c.x,c.y,0,c.x,c.y,15);
  gl.addColorStop(0,c.col+'40');gl.addColorStop(1,c.col+'00');
  cx.fillStyle=gl;cx.beginPath();cx.arc(c.x,c.y,15,0,Math.PI*2);cx.fill();
  // Dot
  cx.beginPath();cx.arc(c.x,c.y,i===0?8:5,0,Math.PI*2);cx.fillStyle=c.col;cx.fill();
  // Label
  cx.fillStyle='#e2e8f0';cx.font=(i===0?'bold ':'')+'12px sans-serif';cx.textAlign='center';
  cx.fillText(c.label,c.x,c.y-12);
}

// Title
cx.fillStyle='#3b82f6';cx.font='bold 16px sans-serif';cx.textAlign='left';
cx.fillText('OntoDB Digital Twin — 全球部署拓扑',20,30);
cx.fillStyle='#64748b';cx.font='12px sans-serif';
cx.fillText('7 个数据中心 | 苏州 · 北京 · 广州 · 成都 · 新加坡 · 迪拜 · 法兰克福',20,50);

console.log('DRAW OK');
</script>
</body>
</html>
