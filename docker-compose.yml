version: '3.8'

services:
  ontodb:
    build: .
    image: ontodb/ontodb:latest
    container_name: ontodb
    restart: unless-stopped
    ports:
      - "7912:7912"   # HTTP API
      - "7913:7913"   # PostgreSQL Wire Protocol
      - "7914:7914"   # MySQL Wire Protocol
    volumes:
      - ontodb-data:/data
    environment:
      - ONTODB_HTTP=0.0.0.0:7912
      - ONTODB_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7912/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  ontodb-data:
    driver: local
