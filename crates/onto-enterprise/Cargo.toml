[package]
name = "onto-enterprise"
version = "0.6.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["OntoDB Team"]
description = "OntoDB Enterprise features — clustering, security, backup, observability"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Encryption dependencies (optional)
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
hex = { version = "0.4", optional = true }
gm-sm4 = { version = "0.10", optional = true }  # SM4 block cipher (国密标准)

# KMS dependencies
ureq = { version = "2", optional = true, features = ["json"] }
base64 = { version = "0.21", optional = true }

# CRC validation
crc32fast = { workspace = true, optional = true }

# Audit log rotation
chrono = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

# Shared dependencies
parking_lot = "0.12"
rand = { version = "0.8", optional = true }
csv = { version = "1", optional = true }
regex = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []

# === Base enterprise features ===
cluster = []
sharding = []

# === Security features (Gov/Finance edition) ===
security = ["dep:ring", "dep:chrono", "dep:crc32fast", "dep:regex", "dep:sha2"]  # RBAC + data masking
encryption = ["dep:ring", "dep:rustls", "dep:tokio-rustls", "dep:hex", "dep:gm-sm4", "dep:ureq", "dep:base64", "dep:chrono"]

# === Backup features ===
backup = ["dep:chrono", "dep:crc32fast", "dep:rand", "dep:csv"]
incremental-backup = ["backup"]
pitr = ["backup"]

# === Observability ===
observability = []

# === Gov/Finance specific ===
audit-retention = ["dep:chrono", "dep:flate2"]
crc-validation = ["dep:crc32fast"]
rolling-upgrade = []

# === Version bundles ===
# Enterprise Standard: cluster + sharding + basic backup
enterprise-standard = ["cluster", "sharding", "backup"]

# Enterprise Gov/Finance: all features
enterprise-gov = [
    "cluster",
    "sharding",
    "security",
    "encryption",
    "backup",
    "incremental-backup",
    "pitr",
    "observability",
    "audit-retention",
    "crc-validation",
    "rolling-upgrade",
]
